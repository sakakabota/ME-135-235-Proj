; ME135 Human Detection — ESP32 PlatformIO Configuration
; ======================================================
; Build & upload:   pio run -t upload
; Serial monitor:   pio device monitor -b 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; --- Serial monitor (debug USB) ---
monitor_speed = 115200

; --- Build flags ---
build_flags =
    -D CORE_DEBUG_LEVEL=3          ; 0=none, 3=info, 5=verbose
    -D CONFIG_UART_ISR_IN_IRAM=1   ; Keep UART ISR in IRAM for 2 Mbaud

; --- Library dependencies ---
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; --- Upload ---
upload_speed = 921600

; --- Partition scheme (default 4 MB, fits our firmware) ---
board_build.partitions = default.csv
