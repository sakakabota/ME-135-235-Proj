; ME135 — ESP32 + Waveshare RGB-Matrix-P2 64x64 + 10k pot
; Target: Adafruit ESP32 Feather V2 (PICO-MINI-02, 8 MB flash, 2 MB PSRAM)
; https://learn.adafruit.com/adafruit-esp32-feather-v2/pinouts

[env:adafruit_feather_esp32_v2]
platform = espressif32@6.5.0
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.15
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1
